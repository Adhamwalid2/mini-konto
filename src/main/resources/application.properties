spring.application.name=mini-konto

# In-memory SQL database (H2). Data is reset on every start.
spring.datasource.url=jdbc:h2:mem:minikonto;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Web console to look at the tables: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:minikonto   User: sa   Password: (empty)
spring.h2.console.enabled=true
